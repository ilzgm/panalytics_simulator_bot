
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no">
  <title>Tap Challenge</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: var(--tg-theme-bg-color, #101522);
      color: var(--tg-theme-text-color, #ffffff);
      text-align: center;
    }

    .game {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 { margin: 12px 0; }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      font-size: 18px;
    }

    .arena {
      position: relative;
      height: min(55vh, 400px);
      min-height: 280px;
      overflow: hidden;
      border: 1px solid #414b63;
      border-radius: 20px;
      background: var(--tg-theme-secondary-bg-color, #1b2335);
    }

    #target {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: #64e6a5;
      box-shadow: 0 0 25px #64e6a577;
      cursor: pointer;
      touch-action: manipulation;
    }

    #target:active { transform: scale(.9); }

    button.action {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: var(--tg-theme-button-color, #5b8cff);
      color: var(--tg-theme-button-text-color, white);
      font-size: 17px;
      font-weight: 700;
    }

    #message {
      min-height: 48px;
      margin-top: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🎯 Tap Challenge</h1>
    <p>Попробуй набрать максимум за 10 секунд!</p>

    <div class="stats">
      <div>Очки: <b id="score">0</b></div>
      <div>Время: <b id="time">10</b> сек.</div>
      <div>Рекорд: <b id="best">0</b></div>
    </div>

    <div class="arena" id="arena">
      <button id="target" hidden
              aria-label="Попасть по мишени"></button>
    </div>

    <button class="action" id="start">Начать игру</button>
    <div id="message">Нажми «Начать игру», чтобы играть.</div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const arena = document.getElementById("arena");
    const target = document.getElementById("target");
    const startBtn = document.getElementById("start");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const bestEl = document.getElementById("best");
    const message = document.getElementById("message");

    let score = 0;
    let timeLeft = 10;
    let playing = false;
    let timerId = null;

    let best = Number(localStorage.getItem("tap-best") || 0);
    bestEl.textContent = best;

    function moveTarget() {
      const maxX = arena.clientWidth - target.offsetWidth;
      const maxY = arena.clientHeight - target.offsetHeight;

      target.style.left = Math.random() * Math.max(0, maxX) + "px";
      target.style.top = Math.random() * Math.max(0, maxY) + "px";
    }

    function finishGame() {
      playing = false;
      clearInterval(timerId);
      target.hidden = true;
      startBtn.textContent = "Играть ещё";
      message.textContent = `Раунд завершён! Твой результат: ${score}.`;
    }

    function startGame() {
      clearInterval(timerId);
      score = 0;
      timeLeft = 10;
      playing = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      message.textContent = "Лови мишень!";
      startBtn.textContent = "Игра идёт…";
      target.hidden = false;
      startBtn.disabled = true;

      moveTarget();

      timerId = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          finishGame();
          startBtn.disabled = false;
        }
      }, 1000);
    }

    target.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      if (!playing) return;

      score++;
      scoreEl.textContent = score;

      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("tap-best", best);
      }

      moveTarget();
    });

    startBtn.addEventListener("click", startGame);

    window.addEventListener("resize", () => {
      if (playing) moveTarget();
    });
  </script>
</body>
</html>
