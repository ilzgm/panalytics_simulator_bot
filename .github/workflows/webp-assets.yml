name: Generate optimized WebP assets

on:
  push:
    branches:
      - "perf/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Convert game art to WebP
        run: python scripts/optimize_assets.py
      - name: Commit generated assets
        run: |
          if git diff --quiet -- images; then
            echo "No generated image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Generate optimized WebP game assets"
          git push
